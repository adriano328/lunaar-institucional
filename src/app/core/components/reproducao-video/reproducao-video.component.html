<div class="video-institucional" (click)="togglePlay()">
  <video
    #player
    [src]="videoSrc"
    [autoplay]="autoplay"
    [muted]="muted"
    [loop]="loop"
    [attr.playsinline]="playsInline ? '' : null"
    preload="auto"
  ></video>

  <div class="video-overlay"></div>

  @if (!isPlaying && showPlayOverlay && !autoplay) {
    <button class="video-play" type="button" aria-label="Reproduzir vídeo">
      <span class="material-symbols-outlined">play_arrow</span>
      <span>Assistir</span>
    </button>
  }

  @if (title || subtitle) {
    <div class="video-content">
      @if (title) { <h1>{{ title }}</h1> }
      @if (subtitle) { <p>{{ subtitle }}</p> }
    </div>
  }
</div>
