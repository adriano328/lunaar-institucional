<div class="video-institucional">
  <video
    [src]="videoSrc"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
  ></video>

  <div class="video-overlay"></div>

  @if (title || subtitle) {
    <div class="video-content">
      @if (title) {
        <h1>{{ title }}</h1>
      }

      @if (subtitle) {
        <p>{{ subtitle }}</p>
      }
    </div>
  }
</div>
