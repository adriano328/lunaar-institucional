<div class="container-carrosel">
  <p-carousel
    [value]="fotos"
    [numVisible]="1"
    [numScroll]="1"
    [circular]="true"
    [autoplayInterval]="3500"
  >
    <ng-template pTemplate="item" let-foto>
      <div class="carousel-item">
        <img [src]="foto" class="carousel-img" alt="Foto de adoção" />
      </div>
    </ng-template>
  </p-carousel>
</div>
