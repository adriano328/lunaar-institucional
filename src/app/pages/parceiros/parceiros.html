<div class="flex justify-content-center align-items-center container-parceiros">
  <div class="grid conteudo-principal">
    <div class="flex flex-column align-items-start justify-content-center col-12">
      <h3>Parceiros</h3>
      <p class="texto">
        Empresas e pessoas que fortalecem a nossa causa e fazem a diferença todos os dias.
      </p>
    </div>

    <section class="partners-grid" aria-label="Parceiros">
      @for (p of partners; track p.name) {
        <article class="partner-card" [attr.aria-label]="p.name">
          <div class="logo-wrap" title="{{ p.name }}">
            <div class="seal" aria-hidden="true"></div>
            <img class="logo" [src]="p.logoUrl" [alt]="p.name" loading="lazy" />
          </div>
        </article>
      }
    </section>
  </div>
</div>
