<section class="parceiros-container flex flex-column justify-content-center align-items-center">
  <div class="flex justify-content-center align-items-center">
    <h3 class="titulo">Pontos de Coleta para Doações</h3>
  </div>
  <div class="conteudo-principal">
    @for (parceiro of parceiros; track parceiro.nome) {
      <article class="parceiro-card">
        <div class="icone" aria-hidden="true">🐾</div>

        <h3 class="titulo-card">{{ parceiro.nome }}</h3>

        <p class="endereco">{{ parceiro.endereco }}</p>

        <button class="btn-maps" type="button" (click)="abrirMaps(parceiro.map)">
          📍 Abrir no Maps
        </button>
      </article>
    }
  </div>
</section>
